<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch | Tu Algoritmo Personal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="logo"><i class="fas fa-film"></i> CineMatch</div>
            <button class="btn-nav" onclick="toggleView()" id="btn-view">
                <i class="fas fa-star"></i> Mi Top 10
            </button>
        </nav>

        <main>
            <section id="feed-section">
                <div class="feed-header">
                    <h2>¿Qué prefieres ver hoy?</h2>
                    <p>Elige una opción para entrenar tu algoritmo</p>
                </div>

                <div class="movie-clash">
                    <div class="movie-card" onclick="votar('A')" id="card-a">
                        <div class="poster-container">
                            <img src="" alt="Poster A" id="img-a">
                        </div>
                        <div class="movie-info">
                            <h3 id="title-a">Cargando...</h3>
                            <span class="genre" id="genre-a">Género</span>
                        </div>
                    </div>

                    <div class="vs-divider"><span>VS</span></div>

                    <div class="movie-card" onclick="votar('B')" id="card-b">
                        <div class="poster-container">
                            <img src="" alt="Poster B" id="img-b">
                        </div>
                        <div class="movie-info">
                            <h3 id="title-b">Cargando...</h3>
                            <span class="genre" id="genre-b">Género</span>
                        </div>
                    </div>
                </div>
                
                <div class="stats">
                    <p>Decisiones tomadas: <span id="vote-count">0</span></p>
                </div>
            </section>

            <section id="profile-section" class="hidden">
                <div class="profile-header">
                    <h2>Tus Recomendaciones</h2>
                    <p>Las películas que más hacen match contigo</p>
                </div>
                
                <div class="recommendations-list" id="recommendations-list">
                    </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
